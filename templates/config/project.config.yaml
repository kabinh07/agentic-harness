# Project configuration — single source of truth for tools, IDs, business-goal
# priorities, and codebase segmentation. Filled in by /agentic-harness:configure from the BRD
# in BRD/, then kept current by /agentic-harness:architect as the codebase grows. Everything
# here is read by CLAUDE.md, /agentic-harness:architect, /agentic-harness:run-manager, and any tool-mirror
# skill (e.g. clickup-log) before they do anything else.

project:
  name: ""              # short project name
  description: ""       # one-line what/why
  configured: false     # /agentic-harness:configure flips this true once filled

# Path to the generated business-logic doc (goals, priority order, success
# criteria — human-readable, derived from the BRD). This is the rubric both
# /agentic-harness:run-manager (task creation) and /agentic-harness:architect (task acceptance) check
# every task against — a task that serves no goal here doesn't get queued
# without an explicit reason.
business_logic_doc: docs/business-logic.md

# Durable task log — single source of truth for what's done/pending.
task_log: TASK_LOG.md

# Engineering conventions /agentic-harness:architect enforces on every task before marking
# it done — see docs/engineering-standards.md for the actual rules.
architecture:
  standards_doc: docs/engineering-standards.md

  # Codebase segments. /agentic-harness:architect owns this list: it categorizes the
  # project into segments (by responsibility, not by file type), creates a
  # scoped subagent per segment under .claude/agents/, and re-segments as
  # new areas of the codebase appear. Each segment agent only ever touches
  # its own owns_paths — cross-segment edits need architect sign-off.
  #
  # This starts empty for a brand-new project; /agentic-harness:architect fills it in the
  # first time it runs against real code (nothing to segment before code
  # exists).
  segments: []
  # - name: "solver-core"
  #   description: "ALNS operators, VRP constraints, clustering logic"
  #   owns_paths: ["solver/operators/", "solver/dataset/state.py"]
  #   agent: solver-core                 # matches .claude/agents/solver-core.md's `name:` frontmatter
  #   trigger: "ALNS bug, operator logic, constraint violation, clustering"
  #   test_command: "python -m pytest unit_tests/test_state.py unit_tests/test_operators.py -q"

  # Standing, cross-cutting agent — not a codebase segment, doesn't own any
  # paths. Architect dispatches it after every implementation (segment-agent
  # or architect-direct) to write that change's tests. Shipped by the
  # agentic-harness plugin itself, not authored per project the way segment
  # agents are. Deliberately separate from whichever agent wrote the
  # implementation — it doesn't grade its own work.
  test_agent:
    agent: agentic-harness:test-writer   # Agent tool subagent_type

# --- Manager agent -----------------------------------------------------
# /agentic-harness:run-manager reads this. business_goals is priority-ordered (index 0 =
# highest priority), matching docs/business-logic.md's "Goals (priority
# order)" section — the two must stay in sync. analysis_command is
# whatever project-specific script/check produces the data the manager
# agent evaluates against those goals (a test suite, a report generator,
# a benchmark script) — leave blank until the project has one.
manager:
  business_goals: []
  # - "All X assigned/completed — zero-miss is the target"
  # - "Minimize resource Y used"
  analysis_command: ""      # e.g. "python scripts/manager_analysis.py --report output/manager_report.json"
  report_path: ""           # where analysis_command writes its output, if any
  severity_thresholds: {}   # optional: metric -> {warning, fail} pairs

# --- External tool mirrors ----------------------------------------------
# Enable and fill only the tools this project actually uses. Each
# tool-mirror skill (e.g. clickup-log.md) reads its own block here instead
# of hardcoding IDs, so the skill file itself never needs project-specific
# edits.
tools:
  clickup:
    enabled: false
    parent_task_id: ""     # ClickUp task that all TASK_LOG.md rows mirror under, as subtasks
    list_id: ""
    mirror_from_date: ""   # ISO date; rows before this are never backfilled
  github:
    enabled: false
    repo: ""                # owner/repo
  slack:
    enabled: false
    channel: ""
